[project]
name = "obei-workflow-project"
version = "0.1.0"
description = "A ready-to-develop project template powered by the vendored Obei Workflow SDK"
requires-python = ">=3.11"
dependencies = [
  "obei-workflow-sdk==0.3.3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
