[project]
name = "obei-simple-workflow-example"
version = "0.1.0"
description = "Runnable four-stage example for obei-workflow-sdk"
requires-python = ">=3.11"
dependencies = [
  "obei-workflow-sdk==0.1.0",
  "uvicorn>=0.34,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
