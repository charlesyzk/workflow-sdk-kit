[project]
name = "obei-workflow-sdk"
version = "0.3.1"
description = "A traceable workflow SDK with direct-model and durable Dify application calls"
requires-python = ">=3.11"
dependencies = [
  "arq>=0.28,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.2,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "pymysql>=1.1,<2",
  "python-dotenv>=1.0,<2",
  "redis>=5.3,<6",
  "sqlalchemy>=2.0,<3",
  "ulid-py>=1.1,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
